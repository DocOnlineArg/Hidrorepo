; Firmware HidroTwin para ESP32 (Arduino framework).
; Compilar:  pio run          Subir:  pio run -t upload       Monitor: pio device monitor
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  links2004/WebSockets@2.6.1
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
